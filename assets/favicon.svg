<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="yellowSnakeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe600" />
      <stop offset="50%" stop-color="#ffb800" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="blueFlaskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="dropGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#dropGlow)">
    <!-- Flask Body (Maximization to 100% bounds) -->
    <path d="M 216 40 L 296 40 L 296 170 L 440 390 A 48 48 0 0 1 400 472 L 112 472 A 48 48 0 0 1 72 390 L 216 170 Z" 
          fill="url(#blueFlaskGrad)" stroke="#ffffff" stroke-width="16" stroke-linejoin="round" />
    
    <!-- Flask Neck Lip -->
    <rect x="196" y="20" width="120" height="32" rx="12" fill="#38bdf8" stroke="#ffffff" stroke-width="12" />

    <!-- Flask Bubbles & Liquid surface -->
    <ellipse cx="256" cy="300" rx="100" ry="24" fill="#60a5fa" opacity="0.6" />
    <circle cx="230" cy="380" r="22" fill="#ffffff" opacity="0.7" />
    <circle cx="290" cy="330" r="14" fill="#ffffff" opacity="0.9" />

    <!-- Coiled Snake Body Edge-to-Edge (Bold Yellow Gold) -->
    <path d="M 450 160 C 510 240, 490 380, 410 440 C 320 510, 160 500, 70 420 C -10 330, 20 180, 120 100 C 220 20, 360 40, 430 110 C 460 140, 420 180, 380 160 C 320 130, 200 110, 140 180 C 80 250, 100 350, 160 400 C 240 460, 350 440, 400 380 C 450 320, 410 230, 340 210" 
          fill="none" 
          stroke="url(#yellowSnakeGrad)" 
          stroke-width="72" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Snake Outer White Highlight/Contour for Maximum Tab Contrast -->
    <path d="M 450 160 C 510 240, 490 380, 410 440 C 320 510, 160 500, 70 420 C -10 330, 20 180, 120 100 C 220 20, 360 40, 430 110 C 460 140, 420 180, 380 160" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="12" 
          stroke-linecap="round" />

    <!-- Snake Eye -->
    <circle cx="430" cy="120" r="10" fill="#03132e" />
    <circle cx="433" cy="117" r="3" fill="#ffffff" />
  </g>
</svg>
